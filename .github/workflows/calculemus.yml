name: Calculemus Meta OneLiner
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: single-line <2048
        run: |
          test $(wc -c < Leibniz_Calculemus_Meta_OneLiner.sh) -lt 2048
          test $(wc -l < Leibniz_Calculemus_Meta_OneLiner.sh) -eq 2
      - name: exact quine + self-Gödel roundtrip
        run: |
          chmod +x Leibniz_Calculemus_Meta_OneLiner.sh
         ./Leibniz_Calculemus_Meta_OneLiner.sh 4 | tee out.json
          python3 -c "import json,sys; d=json.load(open('out.json')); assert d['exact']==True, d; assert d['omega_attained']==0; assert d['open']==1; print('exact', d['exact'], 'bits', d['godel_bits'])"
      - name: monad / harmony / meta X/Y / universe prefix / Omega
        run: |
          python3 -c "import json; d=json.load(open('out.json')); assert d['model']=='OMEGA_MONAD_LIMIT'; assert d['xy']=='x-y=log(a/b)'; assert d['zeta']=='Y=zeta(X)'; assert 'colim' in d['omega']; print('Monad->Godel->Calculemus->X/Y->Universe->Ω OK')"